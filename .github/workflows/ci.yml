name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  symfony:
    name: Symfony (PHP 8.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: apcu, intl, zip
          tools: composer:v2
          coverage: none

      - name: Install vendors
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Install tools vendors
        run: |
          for dir in tools/*/; do
            if [ -f "$dir/composer.json" ]; then
              composer install --working-dir="$dir" --no-ansi --no-interaction --no-scripts --no-progress
            fi
          done

      - name: Check composer.json
        run: composer validate --strict

      - name: Lint container and config
        run: |
          php bin/console lint:container
          php bin/console lint:yaml config --parse-tags

      - name: ECS
        run: tools/ecs/vendor/bin/ecs check --config tools/ecs/ecs.php

      - name: Rector
        run: tools/rector/vendor/bin/rector --dry-run --clear-cache --config=tools/rector/rector.php

      - name: PHPStan
        run: tools/phpstan/vendor/bin/phpstan analyse --configuration tools/phpstan/phpstan.neon --memory-limit=1G --error-format=github

      - name: PHPArkitect
        run: tools/phparkitect/vendor/bin/phparkitect check --config=tools/phparkitect/phparkitect.php
